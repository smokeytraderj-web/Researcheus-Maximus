<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Analyst Agent</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  *{ box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    color: #14213D;
    background:
      radial-gradient(1100px 620px at 50% -12%, #E4EDF9 0%, rgba(228,237,249,0) 68%),
      linear-gradient(#FBFCFE, #F4F7FB);
    background-attachment: fixed;
  }
  .gate { width: 100%; max-width: 420px; text-align: center; }
  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    color: #65758B; margin-bottom: 18px;
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 30px; line-height: 1.2; font-weight: 600; margin: 0;
  }
  .rule { width: 44px; height: 2px; background: #BFA054; margin: 18px auto 0; }
  .card {
    margin-top: 30px; background: #fff; border: 1px solid #DCE3EC; border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(20,33,61,.05), 0 10px 28px -18px rgba(20,33,61,.32);
  }
  label { display: block; font-size: 13px; color: #65758B; margin-bottom: 12px; }
  input {
    width: 100%; padding: 14px; text-align: center;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 26px; letter-spacing: .5em; text-indent: .5em;
    color: #14213D; background: #F7F9FC;
    border: 1px solid #DCE3EC; border-radius: 10px;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  input:focus {
    outline: none; border-color: #1A4F8B; background: #fff;
    box-shadow: 0 0 0 3px rgba(26,79,139,.14);
  }
  button {
    width: 100%; margin-top: 16px; padding: 13px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: #1A4F8B; border: 0; border-radius: 10px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(18,58,105,.24), 0 4px 12px rgba(18,58,105,.16);
    transition: background-color .15s ease, transform .06s ease;
  }
  button:hover { background: #123A69; }
  button:active { transform: translateY(1px); }
  button[disabled] { background: #9AAAC0; box-shadow: none; cursor: default; }
  .error { min-height: 20px; margin-top: 14px; font-size: 13px; color: #B4453E; }
  .foot { margin-top: 26px; font-size: 12px; color: #65758B; }
</style>
</head>
<body>
  <main class="gate">
    <div class="eyebrow">Technical Analyst Agent</div>
    <h1>Gottfried &amp; Somberg<br>Wealth Management</h1>
    <div class="rule"></div>

    <form class="card" id="form" autocomplete="off">
      <label for="code">Enter your access code</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             autocomplete="off" autofocus aria-describedby="error">
      <button type="submit" id="submit">Continue</button>
      <div class="error" id="error" role="alert"></div>
    </form>

    <div class="foot">Internal use only.</div>
  </main>

<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('code');
  var button = document.getElementById('submit');
  var error = document.getElementById('error');

  // Digits only, and submit itself once four are in -- the code is a fixed
  // length, so making the reader reach for the button adds nothing.
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '');
    error.textContent = '';
    if (input.value.length === 4) form.requestSubmit();
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (input.value.length < 4) return;
    button.disabled = true;

    fetch('/api/unlock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: input.value })
    }).then(function (response) {
      if (response.ok) { window.location.replace(window.location.pathname); return null; }
      return response.json().catch(function () { return {}; });
    }).then(function (data) {
      if (!data) return;
      button.disabled = false;
      input.value = '';
      input.focus();
      error.textContent = data.detail || 'That code was not recognised.';
    }).catch(function () {
      button.disabled = false;
      error.textContent = 'Could not reach the server. Try again.';
    });
  });
})();
</script>
</body>
</html>
