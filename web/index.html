<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Researcheus Maximus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#1B2A4A', ink2: '#2C3A57', body: '#3E4759', muted: '#657386',
        gold: '#BFA054', goldSoft: '#EFE4C7', line: '#DDE1E7', line2: '#EDF0F3', panel: '#F6F7F9',
      },
      fontFamily: {
        serif: ['Source Serif 4', 'Georgia', 'Times New Roman', 'serif'],
        sans: ['IBM Plex Sans', 'Segoe UI', 'system-ui', 'sans-serif'],
        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
      },
    },
  },
}
</script>
<style>
  html, body { height: 100%; background: #FFFFFF; }
  textarea::placeholder, input::placeholder { color: #9AA5B4; }
  textarea:focus, input:focus { outline: none; }
  ::selection { background: #EFE4C7; }
  /* Tailwind's generated .font-serif came out with an empty font-family, so every
     heading silently fell back to the sans stack. Declare it explicitly. */
  .font-serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
  .font-mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  /* Indeterminate progress bar, matching the desktop app's slim navy one. */
  @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
  .bar-track { position: relative; overflow: hidden; height: 6px; border-radius: 3px; background: #EDF0F3; }
  .bar-fill { position: absolute; top: 0; height: 100%; width: 35%; border-radius: 3px; background: #16233F; animation: slide 1.15s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen font-sans text-body antialiased">

<div class="min-h-screen flex flex-col">

  <div class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-3xl">

      <div class="text-center mb-9">
        <h1 class="font-serif text-[34px] sm:text-[46px] font-semibold tracking-tight text-ink leading-[1.12]">
          Gottfried &amp; Somberg<br class="sm:hidden"> Wealth Management
        </h1>
        <div class="h-[3px] w-14 bg-gold mx-auto mt-5"></div>
      </div>

      <!-- Progress / result panel. Hidden until a run starts. -->
      <div id="statusCard" class="hidden mb-4 rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7 shadow-[0_1px_3px_rgba(22,35,63,0.06)]">
        <div class="flex items-baseline justify-between gap-4 mb-4">
          <span id="statusStage" class="font-serif text-[19px] font-semibold text-ink">Preparing evidence</span>
          <span id="statusElapsed" class="font-mono text-[11px] text-muted"></span>
        </div>
        <div id="statusBar" class="bar-track"><div class="bar-fill"></div></div>
        <div id="statusDone" class="hidden">
          <p id="statusSummary" class="text-[14px] text-body leading-relaxed"></p>
          <div class="flex flex-wrap items-center gap-3 mt-5">
            <a id="openReport" href="#" target="_blank" rel="noopener"
               class="rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors">
              Open Report
            </a>
            <button id="copyLink" onclick="copyLink()"
               class="rounded-[7px] border border-line text-ink font-sans font-bold text-sm px-5 py-2.5 hover:bg-panel transition-colors">
              Copy shareable link
            </button>
            <button onclick="resetStatus()"
               class="text-[13px] font-sans font-bold text-muted hover:text-ink transition-colors">
              New research
            </button>
          </div>
        </div>
        <p id="statusError" class="hidden text-[14px] text-[#A0362F] leading-relaxed"></p>
      </div>

      <div class="rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7 shadow-[0_1px_3px_rgba(22,35,63,0.06)]">
        <div class="flex items-center gap-2 mb-4">
          <span class="font-serif text-[15px] font-semibold text-gold">01</span>
          <span class="font-serif text-[19px] font-semibold text-ink">Research Overview</span>
        </div>
        <textarea
          id="queryBox"
          rows="3"
          placeholder="Example: Is TSLA a good opportunity to buy now, and where should I place a stop loss?"
          class="w-full resize-none bg-panel border border-line rounded-[7px] text-[15px] text-ink leading-relaxed placeholder:text-muted p-4 focus:border-gold focus:border-2"
        ></textarea>
        <div class="flex items-center justify-end mt-4">
          <button
            onclick="start('general', 'queryBox')"
            class="shrink-0 rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors"
          >
            Generate Research
          </button>
        </div>
      </div>

      <div class="mt-4 rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7 shadow-[0_1px_3px_rgba(22,35,63,0.06)]">
        <div class="flex items-center gap-2 mb-4">
          <span class="font-serif text-[15px] font-semibold text-gold">02</span>
          <span class="font-serif text-[19px] font-semibold text-ink">Technical</span>
        </div>
        <textarea
          id="deepBox"
          rows="2"
          placeholder="Ticker or company name, plus anything specific you want the technical read to answer."
          class="w-full resize-none bg-panel border border-line rounded-[7px] text-[15px] text-ink leading-relaxed placeholder:text-muted p-4 focus:border-gold focus:border-2"
        ></textarea>
        <div class="flex items-center justify-between gap-4 mt-4">
          <span class="text-[12.5px] text-body">Price structure, momentum, relative strength, Fibonacci, and a risk plan.</span>
          <button
            onclick="start('deep', 'deepBox')"
            class="shrink-0 rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors"
          >
            Open Technical Report
          </button>
        </div>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <input
          id="quickBox"
          type="text"
          placeholder="Quick report — ticker or company name"
          class="flex-1 bg-panel border border-line rounded-[7px] text-[14px] text-ink placeholder:text-muted px-4 py-2.5 focus:border-gold focus:border-2"
        >
        <button onclick="start('technical', 'quickBox')" class="shrink-0 text-[13px] font-sans font-bold text-ink border border-line rounded-[7px] px-5 py-2.5 hover:bg-panel hover:border-muted transition-colors">
          Quick Report &nbsp;&rarr;
        </button>
      </div>

      <p id="modeNote" class="mt-5 text-center text-[12px] text-muted"></p>

    </div>
  </div>

  <div class="flex items-center justify-between px-8 py-4 border-t border-line2 font-mono text-[10.5px] text-ink/40">
    <span>Researcheus Maximus</span>
    <span>Gottfried &amp; Somberg Wealth Management</span>
  </div>

</div>

<script>
  var pollTimer = null, startedAt = 0, reportUrl = '';

  function el(id) { return document.getElementById(id); }

  function resetStatus() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    el('statusCard').classList.add('hidden');
    el('statusDone').classList.add('hidden');
    el('statusError').classList.add('hidden');
    el('statusBar').classList.remove('hidden');
    el('statusElapsed').textContent = '';
  }

  function showRunning(stage) {
    el('statusCard').classList.remove('hidden');
    el('statusDone').classList.add('hidden');
    el('statusError').classList.add('hidden');
    el('statusBar').classList.remove('hidden');
    el('statusStage').textContent = stage || 'Preparing evidence';
    el('statusCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function tickElapsed() {
    var secs = Math.floor((Date.now() - startedAt) / 1000);
    var mins = Math.floor(secs / 60);
    el('statusElapsed').textContent = mins > 0 ? mins + 'm ' + (secs % 60) + 's' : secs + 's';
  }

  function start(mode, boxId) {
    var text = el(boxId).value.trim();
    if (!text) { el(boxId).focus(); return; }
    resetStatus();
    showRunning('Preparing evidence');
    startedAt = Date.now();
    fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, mode: mode })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
    .then(function (res) {
      if (!res.ok) { return showFailed((res.body && res.body.detail) || 'Could not start the research run.'); }
      poll(res.body.id);
    })
    .catch(function () { showFailed('Could not reach the research service.'); });
  }

  function poll(jobId) {
    pollTimer = setInterval(function () {
      tickElapsed();
      fetch('/api/research/' + jobId)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (job) {
          if (job.status === 'running') { el('statusStage').textContent = job.stage; return; }
          clearInterval(pollTimer); pollTimer = null;
          if (job.status === 'failed') { return showFailed(job.error); }
          showReady(job);
        })
        .catch(function () {
          clearInterval(pollTimer); pollTimer = null;
          showFailed('Lost contact with the research service.');
        });
    }, 1500);
  }

  function showReady(job) {
    el('statusBar').classList.add('hidden');
    el('statusDone').classList.remove('hidden');
    el('statusStage').textContent = 'Report ready';
    var name = job.company_name || job.ticker || 'This security';
    var parts = [name];
    if (job.ticker && job.company_name) { parts.push('(' + job.ticker + ')'); }
    var line = parts.join(' ');
    if (job.rating) { line += ' — ' + job.rating; }
    if (job.demo_mode) { line += '. Demonstration mode: values are synthetic and not a client recommendation.'; }
    el('statusSummary').textContent = line;
    reportUrl = new URL(job.report_url, window.location.origin).href;
    el('openReport').href = reportUrl;
    el('copyLink').textContent = 'Copy shareable link';
  }

  function showFailed(message) {
    el('statusCard').classList.remove('hidden');
    el('statusBar').classList.add('hidden');
    el('statusDone').classList.add('hidden');
    el('statusStage').textContent = 'Research failed';
    var box = el('statusError');
    box.textContent = message || 'Research failed.';
    box.classList.remove('hidden');
  }

  function copyLink() {
    if (!reportUrl) return;
    navigator.clipboard.writeText(reportUrl).then(function () {
      el('copyLink').textContent = 'Link copied';
    });
  }

  // Enter submits; Shift+Enter inserts a newline, matching the desktop app.
  [['queryBox', 'general'], ['deepBox', 'deep'], ['quickBox', 'technical']].forEach(function (pair) {
    el(pair[0]).addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); start(pair[1], pair[0]); }
    });
  });

  // Say plainly whether this server is running live research or demo data, so a
  // synthetic report is never mistaken for a real one.
  fetch('/api/health').then(function (r) { return r.json(); }).then(function (h) {
    el('modeNote').textContent = h.live_research
      ? 'Live research is configured on this server.'
      : 'Demonstration mode — reports use synthetic evidence and are not client recommendations.';
  }).catch(function () {});
</script>
</body>
</html>
