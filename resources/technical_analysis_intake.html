<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#1B2A4A', ink2: '#2C3A57', body: '#3E4759', muted: '#657386',
        gold: '#BFA054', goldSoft: '#EFE4C7', line: '#DDE1E7', line2: '#EDF0F3', panel: '#F6F7F9',
      },
      fontFamily: {
        serif: ['Source Serif 4', 'Georgia', 'Times New Roman', 'serif'],
        sans: ['IBM Plex Sans', 'Segoe UI', 'system-ui', 'sans-serif'],
        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
      },
    },
  },
}
</script>
<style>
  html, body { height: 100%; background: #FFFFFF; }
  input::placeholder { color: #9AA5B4; }
  input:focus { outline: none; }
  ::selection { background: #EFE4C7; }
  /* Tailwind's generated .font-serif came out with an empty font-family, so every
     heading silently fell back to the sans stack. Declare it explicitly. */
  .font-serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
  .font-mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
</style>
</head>
<body class="min-h-screen font-sans text-body antialiased">

<div class="min-h-screen flex flex-col">

  <div class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-2xl">

      <div class="text-center mb-9">
        <div class="font-mono text-[10px] tracking-[0.2em] text-gold uppercase mb-4">
          Gottfried &amp; Somberg Wealth Management
        </div>
        <h1 class="font-serif text-4xl sm:text-[42px] font-semibold tracking-tight text-ink leading-tight">
          Technical Analysis
        </h1>
        <div class="h-[3px] w-14 bg-gold mx-auto mt-4"></div>
      </div>

      <div class="rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7">
        <div class="mb-3">
          <span class="font-serif text-[19px] font-semibold text-ink">Which symbol?</span>
        </div>
        <input
          id="queryBox"
          type="text"
          placeholder="Ticker or company name, e.g. AAPL or Apple"
          class="w-full bg-panel border border-line rounded-[7px] text-[15px] text-ink leading-relaxed placeholder:text-muted p-4 focus:border-gold focus:border-2"
        >
        <p class="mt-3 text-[12.5px] text-body leading-relaxed">
          A rating gauge across 1D / 4h / 1h, key Fibonacci levels, and an annotated price chart from TV Remix &mdash;
          a fast supplemental technical read, separate from the full Single Stock Research workflow.
        </p>
        <div class="flex items-center justify-between mt-5">
          <button
            onclick="goBack()"
            class="rounded-[7px] border border-line text-ink font-sans font-bold text-sm px-5 py-2.5 hover:bg-panel transition-colors"
          >
            Back to Overview
          </button>
          <button
            onclick="submitQuery()"
            class="rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors"
          >
            Run Technical Analysis
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="flex items-center justify-between px-8 py-4 border-t border-line2 font-mono text-[10.5px] text-ink/40">
    <span>Researcheus Maximus</span>
    <button onclick="openSettings()" class="hover:text-gold transition-colors">Settings</button>
  </div>

</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  var bridge = null;
  if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
    });
  }
  function submitQuery() {
    var text = document.getElementById('queryBox').value.trim();
    if (!text || !bridge) return;
    bridge.submitTechnicalQuery(text);
  }
  function goBack() { if (bridge) bridge.openOverview(); }
  function openSettings() { if (bridge) bridge.openSettings(); }
  document.getElementById('queryBox').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitQuery();
    }
  });
</script>
</body>
</html>
