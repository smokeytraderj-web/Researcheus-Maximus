<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Analyst Agent</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<script src="vendor/tailwind.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#1B2A4A',
        ink2: '#2C3A57',
        body: '#3E4759',
        muted: '#657386',
        gold: '#BFA054',
        goldSoft: '#EFE4C7',
        line: '#DDE1E7',
        line2: '#EDF0F3',
        panel: '#F6F7F9',
      },
      fontFamily: {
        serif: ['Source Serif 4', 'Georgia', 'Times New Roman', 'serif'],
        sans: ['IBM Plex Sans', 'Segoe UI', 'system-ui', 'sans-serif'],
        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
      },
    },
  },
}
</script>
<style>
  html, body { height: 100%; background: #FFFFFF; }
  textarea::placeholder { color: #9AA5B4; }
  textarea:focus { outline: none; }
  ::selection { background: #EFE4C7; }
  /* Tailwind's generated .font-serif came out with an empty font-family, so every
     heading silently fell back to the sans stack. Declare it explicitly. */
  .font-serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }
  .font-mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
</style>
</head>
<body class="min-h-screen font-sans text-body antialiased">

<div class="min-h-screen flex flex-col">

  <div class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-3xl">

      <div class="text-center mb-9">
        <h1 class="font-serif text-[34px] sm:text-[46px] font-semibold tracking-tight text-ink leading-[1.12]">
          Gottfried &amp; Somberg<br class="sm:hidden"> Wealth Management
        </h1>
        <div class="h-[3px] w-14 bg-gold mx-auto mt-5"></div>
      </div>

      <div class="rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7 shadow-[0_1px_3px_rgba(22,35,63,0.06)]">
        <div class="flex items-center gap-2 mb-4">
          <span class="font-serif text-[15px] font-semibold text-gold">01</span>
          <span class="font-serif text-[19px] font-semibold text-ink">Rating</span>
        </div>
        <textarea
          id="queryBox"
          rows="3"
          placeholder="Example: Is TSLA a good opportunity to buy now, and where should I place a stop loss?"
          class="w-full resize-none bg-panel border border-line rounded-[7px] text-[15px] text-ink leading-relaxed placeholder:text-muted p-4 focus:border-gold focus:border-2"
        ></textarea>
        <div class="flex items-center justify-end mt-4">
          <button
            onclick="submitQuery()"
            class="shrink-0 rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors"
          >
            Generate Research
          </button>
        </div>
      </div>

      <div class="mt-4 rounded-md bg-white border border-line border-t-[3px] border-t-gold p-6 sm:p-7 shadow-[0_1px_3px_rgba(22,35,63,0.06)]">
        <div class="flex items-center gap-2 mb-4">
          <span class="font-serif text-[15px] font-semibold text-gold">02</span>
          <span class="font-serif text-[19px] font-semibold text-ink">Technical</span>
        </div>
        <div class="flex items-center justify-between gap-4">
          <span class="text-[12.5px] text-body">Full multi-timeframe technical read: price structure, momentum, relative strength, Fibonacci, and a risk plan.</span>
          <button
            onclick="openDeep()"
            class="shrink-0 rounded-[7px] bg-gold text-white font-sans font-bold text-sm px-6 py-2.5 hover:bg-[#A88742] transition-colors"
          >
            Open Technical Report
          </button>
        </div>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <input
          id="quickBox"
          type="text"
          placeholder="Quick report — ticker or company name"
          class="flex-1 bg-panel border border-line rounded-[7px] text-[14px] text-ink placeholder:text-muted px-4 py-2.5 focus:border-gold focus:border-2"
        >
        <button onclick="submitQuick()" class="shrink-0 text-[13px] font-sans font-bold text-ink border border-line rounded-[7px] px-5 py-2.5 hover:bg-panel hover:border-muted transition-colors">
          Quick Report &nbsp;&rarr;
        </button>
        <button onclick="openTrack()" class="shrink-0 text-[13px] font-sans font-bold text-ink border border-line rounded-[7px] px-5 py-2.5 hover:bg-panel hover:border-muted transition-colors">
          Track Record &nbsp;&rarr;
        </button>
      </div>

    </div>
  </div>

  <div class="flex items-center justify-between px-8 py-4 border-t border-line2 font-mono text-[10.5px] text-ink/40">
    <span>Technical Analyst Agent</span>
    <button onclick="openSettings()" class="hover:text-gold transition-colors">Settings</button>
  </div>

</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  var bridge = null;
  if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
    });
  }
  function submitQuery() {
    var text = document.getElementById('queryBox').value.trim();
    if (!text || !bridge) return;
    bridge.submitQuery(text);
  }
  function submitQuick() {
    var text = document.getElementById('quickBox').value.trim();
    if (!text || !bridge) return;
    bridge.submitTechnicalQuery(text);
  }
  function openDeep() { if (bridge) bridge.openDeepAnalysis(); }
  function openTrack() { if (bridge) bridge.openTrackRecord(); }
  function openSettings() { if (bridge) bridge.openSettings(); }
  document.getElementById('queryBox').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitQuery();
    }
  });
  document.getElementById('quickBox').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitQuick();
    }
  });
</script>
</body>
</html>
